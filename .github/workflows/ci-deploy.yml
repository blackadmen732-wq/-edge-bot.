# Test every change, then deploy main to Supabase automatically.
# GitHub main is the only source of truth: never deploy from a feature branch or by hand.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test-only packages (in-memory Postgres, jsdom)
        run: |
          npm ci --prefix tests/e2e/db --no-audit --no-fund
          npm ci --prefix tests/ui --no-audit --no-fund
      - name: Unit and database tests
        run: node --test tests/*.test.ts tests/*.test.mjs
      - name: Dashboard UI tests
        run: node --test tests/ui/parallax-ui.test.mjs

  # The real engine end to end (in-memory Postgres, fake Kalshi/odds/email). Reported on its own so a
  # problem here is visible without blocking unit-tested deploys.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --prefix tests/e2e/db --no-audit --no-fund
      - run: bash tests/e2e/run.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mhahkbssltukjhusjsjf
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the Supabase token isn't set yet
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN repository secret to turn on automatic deploys."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.go == 'true'
        with:
          version: latest
      - name: Deploy edge functions
        if: steps.gate.outputs.go == 'true'
        # Both functions check their own tokens, so Supabase's JWT check stays off (same as before).
        run: |
          supabase functions deploy edgebot --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy edge-research --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy parallax-money --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy stocks --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy wx-score --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy lip --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Smoke test the public dashboard endpoint
        if: steps.gate.outputs.go == 'true'
        run: |
          code=$(curl -s -o /tmp/dash.json -w '%{http_code}' "https://$PROJECT_REF.supabase.co/functions/v1/edgebot?task=dashboard")
          echo "dashboard HTTP $code"
          test "$code" = "200"
          grep -q '"market_making"' /tmp/dash.json
