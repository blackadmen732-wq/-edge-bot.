name: TypeScript Engine Tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run core, market-making and forex tests
        run: node --test tests/core.test.ts tests/mm.test.ts tests/forex.test.ts
